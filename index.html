<style>

    background:

      radial-gradient(6px 6px at 61% 74%, #ffd08a, transparent), radial-gradient(8px 8px at 73% 63%, #9ee2ff, transparent),
      radial-gradient(10px 10px at 86% 71%, #ffc66b, transparent), radial-gradient(7px 7px at 97% 66%, #6cc8ff, transparent);
    background-size: 640px 100%; animation: fe-drift 38s linear infinite; }
  .fe-title-bg .fe-lights.far { opacity: .3; filter: blur(22px); background-size: 420px 100%; transform: translateY(-60px); animation-duration: 70s; }
  @keyframes fe-drift { from { background-position: 0 0; } to { background-position: -1280px 0; } }

    background:

  @keyframes fe-roll { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 80px, 0 0; } }
  .fe-grain { position: absolute; inset: -100px; background: var(--fe-grain); opacity: .09; mix-blend-mode: overlay; animation: fe-grain 1s steps(6) infinite; pointer-events: none; }
  @keyframes fe-grain { 0% { transform: translate(0, 0); } 33% { transform: translate(-40px, 20px); } 66% { transform: translate(30px, -30px); } 100% { transform: translate(0, 0); } }
  .fe-letterbox { position: absolute; left: 0; right: 0; height: 44px; background: #000; z-index: 1; }
  .fe-letterbox.top { top: 0; }
  .fe-letterbox.bottom { bottom: 0; }

  .fe-title { position: absolute; left: 0; right: 0; top: 170px; text-align: center; animation: fe-title-in 1.1s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes fe-title-in { from { opacity: 0; transform: scale(1.12); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .fe-logo { display: inline-flex; align-items: flex-end; gap: 8px; filter: drop-shadow(0 0 26px rgba(70, 180, 255, .45)) drop-shadow(0 8px 0 rgba(0, 0, 0, .55)); }
  .fe-logo .fe-wordmark { font-size: 150px; }
  .fe-logo-three { position: relative; top: 6px; font: 900 190px/.8 var(--fe-font); letter-spacing: -.04em; color: transparent;
    -webkit-text-stroke: 5px #fff; text-shadow: 0 0 30px rgba(63, 193, 255, .55); }
  .fe-logo-three canvas { filter: drop-shadow(0 0 0 #fff); }
  .fe-title-sub { margin-top: 22px; display: inline-flex; align-items: center; gap: 14px; }
  .fe-title-sub::before, .fe-title-sub::after { content: ''; width: 70px; height: 2px; background: linear-gradient(90deg, transparent, var(--fe-accent)); }
  .fe-title-sub::after { transform: scaleX(-1); }
  .fe-press { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; animation: fe-pulse 1.3s ease-in-out infinite; cursor: pointer; }
  @keyframes fe-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .fe-legal { position: absolute; left: 0; right: 0; bottom: 56px; z-index: 2; text-align: center; color: #6c8798; font-size: 12.5px; line-height: 1.6; }
  .fe-legal a { color: #9cc6dc; text-decoration: none; border-bottom: 1px solid rgba(156, 198, 220, .4); }
  .fe-legal a:hover { color: #fff; }

  .fe-choice { position: absolute; left: 228px; top: 200px; width: 760px; }
  .fe-choice-note { color: #a8c8da; font-size: 15px; max-width: 640px; margin: 10px 0 18px; }
  .fe-choice-row { height: 46px; display: flex; align-items: center; cursor: pointer; padding-left: 8px; border-left: 3px solid transparent; }
  .fe-choice-row.on { border-left-color: var(--fe-glow); background: linear-gradient(90deg, rgba(54, 179, 255, .16), transparent 70%); }
  .fe-choice-help { margin-top: 16px; color: #cfe6f3; font-size: 16px; min-height: 2.8em; max-width: 640px; }
  .fe-worlds { top: 186px; }
  .fe-world-list { margin-top: 14px; max-height: 330px; overflow-y: auto; scrollbar-width: none; }
  .fe-world-list::-webkit-scrollbar { display: none; }

  .fe-panel { position: absolute; left: 228px; top: 170px; width: 820px; padding: 26px 30px; background: var(--fe-panel); border: 1px solid var(--fe-line); border-left: 4px solid var(--fe-accent); border-radius: 2px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
  .fe-panel-body { margin-top: 14px; white-space: pre-wrap; color: #d5e8f3; font-size: 17px; line-height: 1.55; }
  .fe-input { width: 100%; box-sizing: border-box; margin-top: 14px; padding: 10px 12px; font: 16px system-ui, sans-serif; background: #0c1a26; color: #e8f6ff; border: 1px solid #2c5574; border-radius: 2px; }
  .fe-panel-buttons { margin-top: 14px; display: flex; gap: 10px; }
  .fe-btn { font: 800 14px var(--fe-font); letter-spacing: .06em; text-transform: uppercase; padding: 9px 16px; background: #102a3f; color: #e8f6ff; border: 1px solid #2f6a91; border-radius: 2px; cursor: pointer; }
  .fe-btn:hover { background: #1a4363; }

  #loading { position: fixed; inset: 0; z-index: 3; overflow: hidden; background: #000; font-family: var(--fe-font); }

  #loading[hidden] { display: none; }
  .ld-shot { position: absolute; inset: -6%;
    background:
      radial-gradient(70% 60% at 72% 38%, rgba(54, 160, 230, .28), transparent 70%),
      radial-gradient(50% 50% at 15% 85%, rgba(255, 170, 70, .10), transparent 70%),

    animation: ld-pan 24s ease-in-out infinite alternate; }
  @keyframes ld-pan { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.08) translate(-2%, 1%); } }

  .ld-stripes { position: absolute; inset: -20%; transform: rotate(-14deg); opacity: .06;
    background: repeating-linear-gradient(90deg, #fff 0 60px, transparent 60px 190px); }
  .ld-grain { position: absolute; inset: -100px; background: var(--fe-grain); opacity: .1; mix-blend-mode: overlay; animation: fe-grain 1s steps(6) infinite; }
  .ld-vignette { position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 45%, transparent 45%, rgba(0, 0, 0, .85) 100%); }
  .ld-bar-top, .ld-bar-bottom { position: absolute; left: 0; right: 0; background: #000; }
  .ld-bar-top { top: 0; height: 7vh; }
  .ld-bar-bottom { bottom: 0; height: 15vh; border-top: 1px solid rgba(120, 190, 230, .14); }

  .ld-brand { position: absolute; left: 6vw; top: 1.6vh; height: 4vh; display: flex; align-items: center; gap: 12px; }
  .ld-brand-mark { font: 800 3.1vh/1 var(--fe-font); letter-spacing: -.04em; color: #fff; }
  .ld-brand-tag { font: 800 1.35vh/1 var(--fe-font); letter-spacing: .22em; color: var(--fe-dim); padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .2); }

  .load-card { position: absolute; left: 6vw; right: 6vw; top: 16vh; }
  .ld-kicker { font: 800 clamp(11px, 1.6vh, 16px)/1 var(--fe-font); letter-spacing: .3em; color: var(--fe-accent); margin-bottom: 1.4vh; }
  .load-card h1 { margin: 0; font: 900 clamp(34px, 9vh, 104px)/.95 var(--fe-font); letter-spacing: -.01em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 24px rgba(54, 179, 255, .45), 0 6px 0 rgba(0, 0, 0, .5); animation: ld-slide .7s cubic-bezier(.2, .8, .2, 1) both; }
  .load-card h1 canvas { max-width: 100%; height: auto !important; }
  @keyframes ld-slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  #load-map { color: #9fd6f6; }
  .ld-underline { width: min(340px, 40vw); height: 4px; margin-top: 2.4vh; background: linear-gradient(90deg, var(--fe-accent), transparent); }

  .ld-tip { position: absolute; left: 6vw; bottom: 22vh; width: min(620px, 80vw); padding: 2vh 24px 2vh 22px; background: rgba(0, 0, 0, .55); border-left: 4px solid var(--fe-accent);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .ld-tip-head { font: 800 clamp(11px, 1.5vh, 14px)/1 var(--fe-font); letter-spacing: .24em; color: var(--fe-accent); margin-bottom: 1vh; }

  .ld-status { flex: 1; min-width: 0; }
  #load-label { font: 600 clamp(12px, 1.7vh, 15px)/1.4 system-ui, sans-serif; color: #a9c6d8; min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; margin-top: 1.2vh; background: rgba(120, 190, 230, .14); overflow: hidden; }

  .ld-board { width: clamp(40px, 7vh, 64px); height: clamp(40px, 7vh, 64px); animation: ld-kickflip 1.6s cubic-bezier(.45, 0, .55, 1) infinite; }
  @keyframes ld-kickflip {

  }

  #load-note { position: absolute; right: 6vw; top: 1.6vh; height: 4vh; display: flex; align-items: center; gap: 14px; font: 12px/1.3 system-ui, sans-serif; color: #5f7d90; max-width: 52vw; text-align: right; }
  #load-back { flex: none; font: 800 12px var(--fe-font); letter-spacing: .1em; text-transform: uppercase; padding: 6px 12px; background: transparent; color: #cfe3ef; border: 1px solid #2f6a91; border-radius: 2px; cursor: pointer; }
  #load-back:hover { background: #123049; }

  @media (prefers-reduced-motion: reduce) {

  }

  #touch-controls { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none;
    user-select: none; -webkit-user-select: none; touch-action: none; }

  #touch-controls > * { pointer-events: auto; position: absolute; touch-action: none; }
  .tc-stick { width: 132px; height: 132px; border-radius: 50%; background: rgba(10, 20, 30, .28);
    border: 2px solid rgba(255, 255, 255, .28); bottom: max(22px, env(safe-area-inset-bottom)); }
  .tc-left { left: max(22px, env(safe-area-inset-left)); }

  .tc-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
  .tc-button { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 800 15px/1 system-ui, sans-serif; color: #fff; background: rgba(10, 20, 30, .45) center / 82% no-repeat;

  .tc-button.glyph { background-color: rgba(0, 0, 0, .25); border-color: transparent; }
  .tc-button.down { transform: scale(.88); filter: brightness(1.4); }
  .tc-a { right: max(78px, calc(env(safe-area-inset-right) + 56px)); bottom: max(22px, env(safe-area-inset-bottom)); }
  .tc-b { right: max(18px, env(safe-area-inset-right)); bottom: max(80px, calc(env(safe-area-inset-bottom) + 58px)); }
  .tc-x { right: max(138px, calc(env(safe-area-inset-right) + 116px)); bottom: max(80px, calc(env(safe-area-inset-bottom) + 58px)); width: 46px; height: 46px; }
  .tc-y { right: max(78px, calc(env(safe-area-inset-right) + 56px)); bottom: max(138px, calc(env(safe-area-inset-bottom) + 116px)); }

  .tc-start, .tc-back { top: max(14px, env(safe-area-inset-top)); width: 46px; height: 34px; border-radius: 8px; }
  .tc-start { left: calc(50% + 6px); }
  .tc-back { left: calc(50% - 52px); }
</style>
</head>
<body>
<div id="stage"><canvas id="skate-canvas" tabindex="0"></canvas></div>
<div id="panel"></div>
<div id="loading" hidden>
  <div class="ld-shot"></div>
  <div class="ld-stripes"></div>
  <div class="ld-grain"></div>
  <div class="ld-vignette"></div>
